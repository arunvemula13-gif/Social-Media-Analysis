version: '3.8'

services:
  spedo-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spedo-analytics:1.0.0
    container_name: spedo-analytics
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:h2:file:/app/data/spedo_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sa}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
      - H2_CONSOLE_ENABLED=${H2_CONSOLE_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - DEMO_MODE_ENABLED=${DEMO_MODE_ENABLED:-false}
      - APP_INTEGRATIONS_YOUTUBE_API_KEY=${APP_INTEGRATIONS_YOUTUBE_API_KEY:-AIzaSyBJ-gm6tyRPjzannSWxVJt6ZF5Y84r_PHo}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-arunvemula13@gmail.com}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Password123!}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-Arun Vemula}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
    volumes:
      - spedo-data:/app/data

volumes:
  spedo-data:
    name: spedo-analytics-data
