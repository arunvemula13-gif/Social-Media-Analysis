<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — SPEDO Analytics</title>
    <link rel="stylesheet" href="css/styles.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-header">
                <a href="index.html" class="brand-logo">
                    <div class="brand-icon">S</div>
                    <span style="color:var(--text-dark);">SPEDO</span>
                </a>
                <h2>Reset Your Password</h2>
                <p>Enter your verification code and choose a new secure password</p>
            </div>

            <div id="resetAlert" style="display:none; padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;"></div>

            <form id="resetForm" onsubmit="handleResetSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Work Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="you@company.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="token">6-Digit Verification Code</label>
                    <input type="text" id="token" class="form-control" placeholder="e.g. 123456" required maxlength="30" style="letter-spacing:2px; font-weight:700;">
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <label class="form-label" for="newPassword" style="margin-bottom:0;">New Password</label>
                        <a href="#" style="font-size:12px; color:var(--primary-blue); text-decoration:none;" onclick="togglePasswordVisibility(); return false;" id="togglePwdLink">Show Password</a>
                    </div>
                    <input type="password" id="newPassword" class="form-control" placeholder="•••••••• (min 6 characters)" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; margin-top:8px;">
                    <span>Update Password & Continue</span>
                </button>
            </form>

            <div style="margin-top:24px; text-align:center; font-size:13px; color:var(--text-secondary);">
                Remembered your password? <a href="login.html" style="font-weight:600; color:var(--primary-blue);">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check saved theme preference
        if (localStorage.getItem('spedo_theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // Auto-read URL query parameters (?email=...&token=...)
        const urlParams = new URLSearchParams(window.location.search);
        const emailParam = urlParams.get('email');
        const tokenParam = urlParams.get('token');

        if (emailParam) {
            document.getElementById('email').value = emailParam.trim();
        }
        if (tokenParam) {
            document.getElementById('token').value = tokenParam.trim();
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('newPassword');
            const link = document.getElementById('togglePwdLink');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                link.innerText = 'Hide Password';
            } else {
                pwdInput.type = 'password';
                link.innerText = 'Show Password';
            }
        }

        async function handleResetSubmit(e) {
            e.preventDefault();
            const alertBox = document.getElementById('resetAlert');
            alertBox.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const token = document.getElementById('token').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!email || !token) {
                showAlert('Please provide both your email address and verification code.', 'error');
                return;
            }

            if (!newPassword || newPassword.length < 6) {
                showAlert('New password must be at least 6 characters long.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match. Please verify.', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span>Updating password...</span>';

            try {
                await Auth.resetPassword(email, token, newPassword);
                showAlert('Password reset successfully! Redirecting to sign in...', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<span>Update Password & Continue</span>';
                showAlert(err.message || 'Password reset failed. Please check the code and try again.', 'error');
            }
        }

        function showAlert(msg, type) {
            const alertBox = document.getElementById('resetAlert');
            alertBox.style.display = 'block';
            if (type === 'success') {
                alertBox.style.background = '#f0fdf4';
                alertBox.style.color = '#166534';
                alertBox.style.border = '1px solid #86efac';
            } else {
                alertBox.style.background = '#fef2f2';
                alertBox.style.color = '#991b1b';
                alertBox.style.border = '1px solid #f87171';
            }
            alertBox.textContent = msg;
        }
    </script>
</body>
</html>
