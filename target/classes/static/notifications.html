<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications & System Alerts — SPEDO</title>
    <link rel="stylesheet" href="css/styles.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-layout">
        <aside class="app-sidebar" id="sidebar"></aside>

        <div class="app-main">
            <header class="app-header" id="header"></header>

            <main class="page-content">
                <div class="page-title-bar">
                    <div class="page-heading">
                        <h1>Notifications & Intelligence Alerts</h1>
                        <p>Real-time telemetry on follower milestones, sync events, competitor movements, and generated reports.</p>
                    </div>

                    <div style="display:flex; gap:12px;">
                        <button class="btn btn-outline btn-sm" onclick="toggleUnreadFilter()" id="filterUnreadBtn">
                            Show Unread Only
                        </button>
                        <button class="btn btn-primary btn-sm" onclick="markAllNotificationsAsRead()">
                            Mark All Read
                        </button>
                    </div>
                </div>

                <div class="card" style="padding:0; overflow:hidden;">
                    <div id="notificationsList" style="display:flex; flex-direction:column;">
                        <div style="text-align:center; padding:40px; color:#94a3b8;">Loading notifications...</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js?v=2"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
