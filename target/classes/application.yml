server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: spedo-analytics
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/spedo_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;FILE_LOCK=FS}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:${H2_DB_USER:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${H2_DB_PASSWORD:}}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 7000
          timeout: 7000
          writetimeout: 7000

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  demo-mode:
    enabled: ${DEMO_MODE_ENABLED:false}
  scheduling:
    sync-cron: "0 0 * * * *" # Every hour
  integrations:
    youtube:
      api-key: ${APP_INTEGRATIONS_YOUTUBE_API_KEY:AIzaSyBJ-gm6tyRPjzannSWxVJt6ZF5Y84r_PHo}
